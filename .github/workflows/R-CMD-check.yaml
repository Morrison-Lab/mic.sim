# Workflow derived from https://github.com/Morrison-Lab/gha/blob/main/examples/r-cmd-check.yml
# Complete reference: https://morrison-lab.github.io/gha/reference/r-cmd-check.html
#
# Two jobs: the full OS x R-version matrix (macOS, Windows, and Linux on
# R devel/release/oldrel-1), and a hard-dependencies-only check that runs
# only on pull_request, so a package listed in Suggests but used
# unconditionally fails here instead of on CRAN.
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  R-CMD-check:
    uses: Morrison-Lab/gha/.github/workflows/r-cmd-check.yml@v2
    with:
      # Matches the threshold the hand-rolled workflow used. Tighten to
      # '"note"' (the gha default, and what CRAN effectively requires) once
      # `R CMD check --as-cran` is clean.
      error-on: '"error"'
  R-CMD-check-hard:
    uses: Morrison-Lab/gha/.github/workflows/r-cmd-check.yml@v2
    with:
      hard: true
