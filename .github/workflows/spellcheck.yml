# Workflow derived from https://github.com/Morrison-Lab/gha/blob/main/examples/spellcheck.yml
# Spellchecks DESCRIPTION, man/*.Rd, vignettes, and README with {spelling},
# accepting words listed in inst/WORDLIST.
name: Spellcheck

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: spellcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spellcheck:
    uses: Morrison-Lab/gha/.github/workflows/spellcheck.yml@v2
