# Workflow derived from https://github.com/Morrison-Lab/gha/blob/main/examples/check-links.yml
# The calling job grants issues:write so the workflow can open an issue when
# links break on main; repos default to a read-only token.
name: Check Links

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Run weekly on Mondays at 9:00 UTC to catch link rot
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: Morrison-Lab/gha/.github/workflows/check-links.yml@v2
